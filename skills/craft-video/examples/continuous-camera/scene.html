<!doctype html>
<meta charset="utf-8">
<title>continuous-camera: one world, one camera, no cuts</title>
<!-- A one-take video: ONE page holds every beat as a station in one world, and ONE camera travels between them, keyed from the narration cues in timeline.json.
     Nothing is cut or swapped: a dot rides the camera and a route line is drawn as it goes, so each beat grows out of the last.
     The camera arrives 0.15 s before each sentence starts, holds until it ends, and travels in the gap (at least 0.7 s: ask tighten_voice.py for 0.7 s gaps at the big moves, --gaps).
     Every value is a pure function of t. Zoom is keyed in LOG space so equal steps feel equal; the far dots move by 1/(1+depth) of the camera, so they slide slowly past.
     World units are vh. Method: reference/visual-craft.md, "Cuts and transitions" (the idea is onetake's; this is our own, clean-room).
     render.sh scene.html out.mp4 --provider html --timeline timeline.json --width 1920 --height 1080 --fps 30 --duration 14 -->
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--cv-ground, #0a0a0b); color: var(--cv-ink, #f2f2f0); }
  .layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #far   { width: 600vh; height: 600vh; margin: -300vh 0 0 -300vh; background-image: radial-gradient(circle, rgba(255,255,255,.3) 0.3vh, transparent 0.45vh); background-size: 9vh 9vh; }
  .st    { position: absolute; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; }
  .big   { font: 900 17vh/0.9 var(--cv-display-font, 'Big Shoulders Display', sans-serif); text-transform: uppercase; }
  .tag   { font: 500 2.6vh var(--cv-label-font, 'IBM Plex Mono', monospace); letter-spacing: .2em; text-transform: uppercase; color: var(--cv-muted, #8a8a90); margin-bottom: 2vh; }
  .sub   { font: 400 3.6vh var(--cv-text-font, 'IBM Plex Mono', monospace); margin-top: 2.5vh; }
  #route { position: absolute; left: 0; top: 0; overflow: visible; }
  #dot   { position: absolute; width: 5vh; height: 5vh; margin: -2.5vh 0 0 -2.5vh; border-radius: 50%; background: var(--cv-accent, #ff2e88); }
</style>
<div id="far" class="layer"></div>
<div id="world" class="layer">
  <svg id="route" width="1" height="1"><path id="path" fill="none" stroke="var(--cv-accent, #ff2e88)" stroke-linecap="round"/></svg>
  <div id="dot"></div>
</div>
<script>
  const spec = window.__CV_SPEC || { timeline: null };
  const sents = (spec.timeline && spec.timeline.sentences) || [{ start: 0.4, end: 3.2 }, { start: 4.4, end: 7.2 }, { start: 8.4, end: 11.2 }, { start: 12.4, end: 13.6 }];
  const u = innerHeight / 100;                                                        // px per vh: the world is laid out in vh
  const ST = [{ x: 0, y: 0, tag: "one world", big: "One camera", sub: "it never cuts" }, { x: 190, y: -70, tag: "every beat", big: "Grows out", sub: "of the one before" },
              { x: 380, y: 60, tag: "the carrier", big: "A dot rides", sub: "from beat to beat" }, { x: 560, y: -30, tag: "the rule", big: "No wipes", sub: "just travel" }];
  const world = document.getElementById("world"), far = document.getElementById("far"), dot = document.getElementById("dot"), path = document.getElementById("path");
  ST.forEach((s, i) => { const d = document.createElement("div"); d.className = "st"; d.style.left = s.x + "vh"; d.style.top = s.y + "vh";
    d.innerHTML = `<div class="tag">${String(i + 1).padStart(2, "0")} / ${s.tag}</div><div class="big">${s.big}</div><div class="sub">${s.sub}</div>`; world.appendChild(d); });
  const LANE = 21;                                                                     // the carrier and its route run 21 vh below the text, so they never cover a headline
  path.setAttribute("d", ST.map((s, i) => `${i ? "L" : "M"}${s.x * u} ${(s.y + LANE) * u}`).join(" ")); path.setAttribute("stroke-width", 0.7 * u);   // path units are px, the stations are in vh
  const LEN = ST.slice(1).map((s, i) => Math.hypot(s.x - ST[i].x, s.y - ST[i].y) * u), TOTAL = path.getTotalLength();
  const E = (k) => { k = Math.min(1, Math.max(0, k)); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };      // in-out cubic: a camera starts and stops gently
  const keys = sents.slice(0, ST.length).map((s, i) => ({ arrive: Math.max(0, s.start - 0.15), leave: s.end, st: ST[i] }));     // arrive 0.15 s before a sentence, leave when it ends
  const PUSH = 0.05, clamp01 = (x) => Math.min(1, Math.max(0, x));                    // a slow push-in (5% of zoom) through every hold: a camera that stands still reads as a slide
  function cam(t) {                                                                    // { x, y, lz (log zoom), seg (segment index), e (progress along it) }
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1], go = Math.min(a.leave, b.arrive - 0.7);      // the trip takes at least 0.7 s and ends as the next sentence is about to begin
      if (t < go) return { x: a.st.x, y: a.st.y, lz: PUSH * clamp01((t - a.arrive) / Math.max(0.001, go - a.arrive)), seg: i, e: 0 };
      if (t < b.arrive) { const e = E((t - go) / (b.arrive - go));
        return { x: a.st.x + (b.st.x - a.st.x) * e, y: a.st.y + (b.st.y - a.st.y) * e, lz: PUSH * (1 - e) - 0.55 * Math.sin(Math.PI * e), seg: i, e }; }   // pull back in the middle: it reads as a journey
    }
    const l = keys[keys.length - 1]; return { x: l.st.x, y: l.st.y, lz: PUSH * clamp01((t - l.arrive) / Math.max(0.001, (spec.duration || 14) - l.arrive)), seg: keys.length - 1, e: 0 };
  }
  window.craftvideo = { seek(t) {
    const c = cam(t), z = Math.exp(c.lz), k = 1 / (1 + 3);                             // the far layer is at depth 3: it follows the camera by a quarter
    const put = (el, s, cx, cy) => { el.style.transform = `translate(${innerWidth / 2}px, ${innerHeight / 2}px) scale(${s}) translate(${-cx * u}px, ${-cy * u}px)`; };
    put(world, z, c.x, c.y); put(far, Math.pow(z, k), c.x * k, c.y * k);
    dot.style.left = c.x + "vh"; dot.style.top = (c.y + LANE) + "vh"; dot.style.transform = `scale(${1.6 / z})`;      // the carrier stays one size on screen while the world zooms
    const drawn = LEN.reduce((s, L, i) => s + (i < c.seg ? L : i === c.seg ? L * c.e : 0), 0);                  // the route is drawn exactly as far as the camera has travelled
    path.style.strokeDasharray = `${TOTAL}`; path.style.strokeDashoffset = `${TOTAL - drawn}`;
    return document.fonts.ready;
  } };
</script>
