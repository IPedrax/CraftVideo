<!doctype html>
<meta charset="utf-8">
<title>three-3d: a craft-video Three.js scene</title>
<style>
  html, body { margin: 0; background: #0a0a0b; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: #f2f2f0; font-family: 'IBM Plex Mono', monospace; }
  #kicker { position: absolute; left: 6.25vw; top: 6vh; padding: 0.6vh 0.9vw; background: #f2f2f0; color: #0a0a0b; letter-spacing: 0.24em; font-size: 1.4vw; }
  #title { position: absolute; left: 6.25vw; bottom: 9vh; font: 900 9vw/0.92 'Big Shoulders Display', 'Arial Narrow', sans-serif; text-transform: uppercase; }
  #bar { position: absolute; left: 0; top: 0; height: 6px; background: #ff2e88; }
</style>
<div id="ui"><div id="bar"></div><div id="kicker">THREE.JS SCENE EXAMPLE</div><div id="title"></div></div>
<script type="module">
  // Bare `three` and `three/addons/` are resolved by the renderer (scripts/get_three.sh installs them). Every motion below is a
  // pure function of t: no clock, no requestAnimationFrame loop, no Math.random (a seeded generator instead).
  import * as THREE from "three";
  import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
  import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
  import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
  import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
  import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
  import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

  const spec = window.__CV_SPEC || { width: 1280, height: 720, fps: 30, duration: 6, timeline: null };
  const ALPHA = !!spec.alpha;       // rendered with --alpha 1: draw only the 3D, on a transparent background, to lay over footage
  const cues = (spec.timeline && spec.timeline.sentences) || [{ label: "hook", start: 0.4 }, { label: "proof", start: 2.4 }, { label: "close", start: 4.4 }];
  const at = (label, d = 0) => (cues.find((c) => c.label === label) || cues[0]).start + d;
  const clamp = (x, a = 0, b = 1) => Math.min(Math.max(x, a), b), smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 4);
  const lerp = (a, b, f) => a + (b - a) * f;
  function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: ALPHA, preserveDrawingBuffer: true });   // preserveDrawingBuffer: the screenshot reads it
  renderer.setPixelRatio(1); renderer.setSize(spec.width, spec.height);
  // Two three.js traps that make frames depend on history (a seek(t) must give the same pixels every time):
  //  - set the background with scene.background, NOT renderer.setClearColor: with a composer and OutputPass the clear colour is
  //    encoded twice (0x0a0a0b came out as 0x38383b) and, after a PMREM environment is built, the FIRST frame differed from the rest.
  //  - no tone mapping here, so brand colours come out exact; ACES or Neutral would crush this near-black to 1/255.
  document.body.prepend(renderer.domElement);
  const scene = new THREE.Scene(); if (!ALPHA) { scene.background = new THREE.Color(0x0a0a0b); scene.fog = new THREE.Fog(0x0a0a0b, 7, 22); }
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;   // procedural studio reflections, no HDRI file
  const camera = new THREE.PerspectiveCamera(32, spec.width / spec.height, 0.1, 60);

  // lights: a hot-pink rim from behind-right, a cool fill, the environment does the rest
  const rim = new THREE.PointLight(0xff2e88, 90, 14, 2); rim.position.set(2.6, 1.4, -2.2); scene.add(rim);
  const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(-3, 4, 4); scene.add(key);

  // floor grid
  const grid = new THREE.GridHelper(60, 60, 0x34343b, 0x1a1a1f); grid.position.y = -1.25; if (!ALPHA) scene.add(grid);

  // the cartridge, built from primitives
  const cart = new THREE.Group(); scene.add(cart);
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.7, 2.0, 0.3, 5, 0.09), new THREE.MeshStandardMaterial({ color: 0x35353c, metalness: 0.35, roughness: 0.42 })); cart.add(body);
  for (let i = 0; i < 4; i++) { const r = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.022, 0.05), body.material); r.position.set(0, 0.93 - i * 0.045, 0.15); cart.add(r); }   // grip ridges, above the label
  const lab = document.createElement("canvas"); lab.width = 512; lab.height = 384; const g = lab.getContext("2d");
  g.fillStyle = "#b9b9b4"; g.fillRect(0, 0, 512, 384); g.fillStyle = "#0a0a0b"; g.fillRect(0, 0, 512, 78);
  g.fillStyle = "#ff2e88"; g.fillRect(0, 78, 512, 10); g.fillStyle = "#0a0a0b"; let fs = 110; do { g.font = `900 ${fs -= 4}px 'Arial Narrow', Arial, sans-serif`; } while (g.measureText("GAME.ROM").width > 450); g.fillText("GAME.ROM", 30, 215);   // fit the text, whatever font the machine has
  g.font = "28px 'IBM Plex Mono', monospace"; g.fillText("0x00 0xFF 0x1A 0x7C  BUILD OK", 30, 300); g.fillStyle = "#b9b9b4"; g.font = "bold 44px monospace"; g.fillText("64 MBIT", 30, 56);
  const label = new THREE.Mesh(new THREE.PlaneGeometry(1.32, 0.99), new THREE.MeshStandardMaterial({ map: Object.assign(new THREE.CanvasTexture(lab), { colorSpace: THREE.SRGBColorSpace }), roughness: 0.6 })); label.position.set(0, 0.2, 0.152); cart.add(label);
  const gold = new THREE.MeshStandardMaterial({ color: 0xd9b45a, metalness: 1, roughness: 0.28 });
  for (let i = 0; i < 14; i++) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.34, 0.02), gold); p.position.set(-0.78 + i * 0.12, -0.78, 0.0); cart.add(p); }

  // code particles: a cloud of "machine code" around the cartridge that sorts itself into lines of "source" on the proof cue
  const N = 520, rnd = mulberry32(2026), cloud = [], lines = [];
  const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff }), N); scene.add(inst);
  for (let i = 0; i < N; i++) {
    const a = rnd() * Math.PI * 2, r = 1.6 + rnd() * 2.2, y = (rnd() - 0.5) * 3.2;
    cloud.push({ a, r, y, sp: 0.15 + rnd() * 0.35, s: 0.025 + rnd() * 0.05 });
    const row = Math.floor(i / 26), col = i % 26, len = 6 + ((row * 7) % 18);
    lines.push({ x: 2.3 + col * 0.11, y: 1.35 - row * 0.2 + 0, z: -0.6 + (row % 3) * 0.05, on: col < len, s: 0.075 });
  }
  const WHITE = new THREE.Color(0xd8d8d4), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), pos = new THREE.Vector3(), col = new THREE.Color();

  // post: bloom makes the pink glow. Not in alpha mode: the bloom and output passes write an opaque alpha, so a transparent overlay renders directly.
  const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(spec.width, spec.height), 0.5, 0.45, 1.0)); composer.addPass(new OutputPass());

  // camera keyed to the narration: wide and slow on the hook, in close on the proof, pulling back on the close
  const keys = [
    { t: 0,            p: [0.0, 0.6, 9.5], l: [0.4, 0, 0] },
    { t: at("proof"),  p: [3.2, 0.9, 6.2], l: [1.8, 0.2, 0] },
    { t: at("close"),  p: [0.5, 0.2, 8.4], l: [1.2, 0, 0] },
    { t: spec.duration, p: [-1.4, 0.5, 11], l: [1.4, 0, 0] },
  ];
  function cam(t) {
    let i = 0; while (i < keys.length - 2 && t > keys[i + 1].t) i++;
    const a = keys[i], b = keys[i + 1], f = smooth((t - a.t) / Math.max(1e-6, b.t - a.t));
    camera.position.set(...a.p.map((v, k) => lerp(v, b.p[k], f))); camera.lookAt(...a.l.map((v, k) => lerp(v, b.l[k], f)));
  }
  const ui = { bar: document.getElementById("bar"), title: document.getElementById("title") };
  if (ALPHA) document.getElementById("ui").style.display = "none";

  function frame(t) {
    cart.rotation.y = -0.6 + t * 0.32 + 0.25 * Math.sin(t * 0.9); cart.rotation.x = 0.12 * Math.sin(t * 0.7); cart.position.y = 0.06 * Math.sin(t * 1.3);
    const sort = smooth((t - at("proof")) / 1.1);                       // 0 = chaotic cloud, 1 = lines of source
    for (let i = 0; i < N; i++) {
      const c = cloud[i], L = lines[i], ang = c.a + t * c.sp;
      const cx = Math.cos(ang) * c.r, cz = Math.sin(ang) * c.r, cy = c.y + 0.12 * Math.sin(t * 1.4 + i);
      const k = clamp(sort * 1.25 - (i % 26) / 26 * 0.25);               // lines fill left to right
      pos.set(lerp(cx, L.x, smooth(k)), lerp(cy, L.y, smooth(k)), lerp(cz, L.z, smooth(k)));
      const s = lerp(c.s, L.on ? L.s : 0.0001, smooth(k)); sc.set(s * (1 + 3.2 * smooth(k) * (L.on ? 1 : 0)), s, s);
      m4.compose(pos, q, sc); inst.setMatrixAt(i, m4);
      col.set(0xff2e88).multiplyScalar(2.2).lerp(WHITE, smooth(k)); inst.setColorAt(i, col);    // pink is HDR (>1) so only it blooms
    }
    inst.instanceMatrix.needsUpdate = true; inst.instanceColor.needsUpdate = true;
    rim.intensity = 90 + 40 * Math.sin(t * 2.2);
    cam(t); if (ALPHA) renderer.render(scene, camera); else composer.render();
    ui.bar.style.width = clamp(t / spec.duration) * 100 + "vw";
    const cur = [...cues].reverse().find((c) => t >= c.start);            // the label of the cue being spoken
    ui.title.textContent = cur ? cur.label : ""; ui.title.style.opacity = cur ? easeOut((t - cur.start) / 0.4) : 0;
  }
  window.craftvideo = { seek(t) { frame(t); return document.fonts.ready; } };
</script>
