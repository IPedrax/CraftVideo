<!doctype html>
<meta charset="utf-8">
<title>looks demo</title>
<!-- One scene, any look: it is styled only with the variables the renderer injects for `--look NAME` (looks/*.json), each with a fallback, so it also renders without one.
     render.sh scene.html out.mp4 --provider html --width 1920 --height 1080 --fps 30 --duration 4 --look dark-keynote -->
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--cv-ground, #0a0a0b); color: var(--cv-ink, #f2f2f0); }
  .abs { position: absolute; white-space: nowrap; }
  #label { left: 6vw; top: 6vh; font-family: var(--cv-label-font, monospace); font-weight: var(--cv-label-weight, 500); font-size: var(--cv-label-size, 2.2vh);
           text-transform: var(--cv-label-transform, uppercase); letter-spacing: .14em; color: var(--cv-muted, #8a8a90); }
  #head  { left: 6vw; top: 14vh; font-family: var(--cv-display-font, sans-serif); font-weight: var(--cv-display-weight, 700); font-size: var(--cv-display-size, 9vh);
           text-transform: var(--cv-display-transform, none); line-height: .95; }
  #num   { left: 6vw; top: 40vh; font-family: var(--cv-hero-font, var(--cv-display-font, sans-serif)); font-weight: var(--cv-hero-weight, var(--cv-display-weight, 700));
           font-size: var(--cv-hero-size, calc(var(--cv-display-size, 9vh) * 1.9)); color: var(--cv-accent, #ff2e88); line-height: .95; }
  #txt   { left: 6vw; top: 76vh; font-family: var(--cv-text-font, sans-serif); font-weight: var(--cv-text-weight, 400); font-size: var(--cv-text-size, 3.4vh); }
  #bar   { left: 6vw; bottom: 7vh; height: .9vh; width: 0; background: var(--cv-signal, #3ad7ff); }
  #dot   { right: 8vw; top: 9vh; width: 10vh; height: 10vh; border-radius: 50%; background: var(--cv-surface, #17171a); border: .7vh solid var(--cv-accent, #ff2e88); }
</style>
<div id="label" class="abs">Looks demo</div>
<div id="head" class="abs">Same scene, any look</div>
<div id="num" class="abs">45%</div>
<div id="txt" class="abs">Colour roles, type roles and sizes come from one JSON file.</div>
<div id="bar" class="abs"></div>
<div id="dot" class="abs"></div>
<script>
  const E = (t) => (1 - Math.exp(-3.41 * t)) / (1 - Math.exp(-3.41));            // softLand, from reference/visual-craft.md
  const prog = (t, t0, d) => E(Math.min(1, Math.max(0, (t - t0) / d)));
  const rise = (id, t, t0, d, dy) => { const e = prog(t, t0, d), n = document.getElementById(id); n.style.opacity = e; n.style.transform = `translateY(${(1 - e) * dy}vh)`; };
  window.craftvideo = { seek(t) {
    rise("label", t, 0, .4, 2); rise("head", t, .15, .5, 4); rise("num", t, .5, .6, 8); rise("txt", t, 1.0, .5, 3); rise("dot", t, .3, .5, 0);
    document.getElementById("bar").style.width = (88 * prog(t, 1.2, 1.6)) + "vw";
    return document.fonts.ready;
  } };
</script>
